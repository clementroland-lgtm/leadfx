<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>LeadFX — Pappers</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a0f;color:#e0e0f0;font-family:system-ui,sans-serif;font-size:14px;padding:20px;}
h1{font-size:20px;margin-bottom:20px;color:#00e87a;}
.box{background:#111118;border:1px solid #222230;border-radius:10px;padding:18px;margin-bottom:16px;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px;}
label{display:block;font-size:11px;color:#888;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px;}
input,select{background:#1a1a24;border:1px solid #2a2a38;border-radius:7px;color:#e0e0f0;padding:9px 12px;font-size:13px;outline:none;width:100%;}
input:focus,select:focus{border-color:#00e87a;}
.fg{display:flex;flex-direction:column;min-width:130px;flex:1;}
button{background:#00e87a;color:#0a0a0f;border:none;border-radius:7px;padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;}
button:hover{opacity:.9;}
button:disabled{background:#333;color:#666;cursor:not-allowed;}
.btn2{background:#1a1a24;color:#e0e0f0;border:1px solid #2a2a38;}
.btn2:hover{border-color:#444;}
.log{font-family:monospace;font-size:11px;color:#00e87a;background:#0d0d14;border-radius:6px;padding:10px;min-height:36px;max-height:80px;overflow-y:auto;margin-bottom:8px;}
.err{color:#ff4455 !important;}
.prog{height:3px;background:#1a1a24;border-radius:2px;margin-bottom:14px;}
.pbar{height:100%;background:#00e87a;border-radius:2px;width:0;transition:width .3s;}
.naf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:5px;margin:8px 0 14px;}
.nc{background:#1a1a24;border:1px solid #222;border-radius:7px;padding:7px 10px;cursor:pointer;font-size:12px;}
.nc:hover{border-color:#333;}
.nc.on{background:#001a0d;border-color:#00e87a;color:#00e87a;}
.nc .c{font-size:9px;color:#555;font-family:monospace;display:block;margin-top:1px;}
.nc.on .c{color:#006633;}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.st{background:#111118;border:1px solid #1a1a28;border-radius:8px;padding:10px 16px;text-align:center;}
.stn{font-size:22px;font-weight:700;}
.stl{font-size:10px;color:#555;text-transform:uppercase;margin-top:2px;}
.tcard{background:#111118;border:1px solid #1a1a28;border-radius:10px;overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{text-align:left;padding:8px 10px;background:#0e0e16;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#555;border-bottom:1px solid #1a1a28;white-space:nowrap;}
td{padding:8px 10px;border-bottom:1px solid #0e0e16;vertical-align:top;}
tr:hover td{background:#0d0d14;}
.nom{font-weight:600;font-size:13px;}
.ca{font-family:monospace;color:#3dde7a;font-weight:600;}
.nb{font-family:monospace;font-size:9px;background:#1a1a24;border:1px solid #222;padding:2px 5px;border-radius:3px;color:#666;}
.lk{font-size:9px;padding:2px 6px;border-radius:3px;border:1px solid #1a1a28;color:#555;text-decoration:none;margin-right:3px;display:inline-block;margin-bottom:2px;}
.lk:hover{border-color:#333;color:#aaa;}
.ef{font-family:monospace;font-size:10px;background:#0d1a2a;border:1px solid #1a2a3a;padding:2px 6px;border-radius:3px;color:#4488ff;}
.dn{font-size:11px;color:#00e87a;margin-top:2px;}
.sub{font-size:10px;color:#444;margin-top:1px;}
</style>
</head>
<body>
<h1>🟢 LeadFX — Scraping Pappers</h1>

<div class="box">
  <div class="row">
    <div class="fg" style="flex:2">
      <label>Clé API Pappers.fr</label>
      <input id="key" value="3c567f2bf2e2def00b113cc31130c658590e2dd641c67e9c" placeholder="Clé Pappers">
    </div>
    <div class="fg">
      <label>CA minimum (€)</label>
      <input id="camin" type="number" value="5000000">
    </div>
    <div class="fg">
      <label>CA maximum (€)</label>
      <input id="camax" type="number" value="125000000">
    </div>
    <div class="fg">
      <label>Effectif minimum</label>
      <select id="eff">
        <option value="">Tous</option>
        <option value="10" selected>10+</option>
        <option value="20">20+</option>
        <option value="50">50+</option>
        <option value="100">100+</option>
      </select>
    </div>
    <div class="fg">
      <label>Résultats par NAF</label>
      <select id="pp">
        <option value="20">20</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
      </select>
    </div>
    <div class="fg">
      <label>Département</label>
      <select id="dept">
        <option value="">Toute la France</option>
        <option value="75">75 Paris</option>
        <option value="92">92 Hauts-de-Seine</option>
        <option value="69">69 Lyon</option>
        <option value="13">13 Marseille</option>
        <option value="33">33 Bordeaux</option>
        <option value="59">59 Lille</option>
        <option value="31">31 Toulouse</option>
        <option value="44">44 Nantes</option>
        <option value="76">76 Le Havre</option>
      </select>
    </div>
  </div>

  <div style="font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">Codes NAF à scraper</div>
  <div class="naf-grid" id="naf-grid"></div>

  <div class="row">
    <button id="btn1" onclick="go(1)">🟢 Lancer page 1</button>
    <button class="btn2" id="btn2" onclick="go(pg+1)" disabled>▶ Page suivante</button>
    <button class="btn2" onclick="xls()">↓ Excel</button>
    <button class="btn2" onclick="csv()">↓ CSV</button>
    <span id="pginfo" style="color:#555;font-size:12px;align-self:center"></span>
  </div>
</div>

<div class="log" id="log">En attente…</div>
<div class="prog"><div class="pbar" id="pb"></div></div>
<div class="stats" id="stats"></div>
<div class="tcard"><table id="tbl"><tr><td style="padding:40px;text-align:center;color:#333">Sélectionne des codes NAF et lance le scraping</td></tr></table></div>

<script>
var NAFS=[
  {c:'4641Z',n:'Grossiste Textile'},
  {c:'4642Z',n:'Grossiste Habillement'},
  {c:'4631Z',n:'Grossiste Céréales'},
  {c:'4632Z',n:'Grossiste Viandes'},
  {c:'4633Z',n:'Grossiste Laitiers'},
  {c:'4637Z',n:'Grossiste Café/Cacao'},
  {c:'4638A',n:'Grossiste Alimentaire'},
  {c:'4638B',n:'Grossiste Fruits/Légumes'},
  {c:'4611Z',n:'Agent Négoce International'},
  {c:'4619B',n:'Agent Commerce Gros'},
  {c:'5229A',n:'Transit / Fret Maritime'},
  {c:'5210B',n:'Logistique Entreposage'},
  {c:'2110Z',n:'Fab. Médicaments'},
  {c:'2120Z',n:'Prod. Vétérinaire'},
  {c:'3030Z',n:'Fab. Aéronefs'},
  {c:'3316Z',n:'Maintenance Aéro'},
  {c:'2562B',n:'Usinage Précision Aéro'},
  {c:'2042Z',n:'Fab. Cosmétiques'},
  {c:'4645Z',n:'Grossiste Cosmétiques'},
  {c:'4211Z',n:'Construction Routes BTP'},
  {c:'4120A',n:'Construction Bâtiments'},
  {c:'4291Z',n:'Travaux Hydrauliques'},
  {c:'4321A',n:'Installations Électriques'},
  {c:'4675Z',n:'Grossiste Produits Chimiques'},
  {c:'2059Z',n:'Fab. Prod. Chimiques'},
  {c:'2016Z',n:'Fab. Matières Plastiques'},
  {c:'3600Z',n:'Distribution Eau'},
  {c:'3511Z',n:'Production Solaire'},
  {c:'4671Z',n:'Grossiste Carburants'},
  {c:'4652Z',n:'Grossiste Électronique'},
  {c:'2612Z',n:'Fab. Cartes Électroniques'},
  {c:'3012Z',n:'Const. Bateaux Plaisance'},
  {c:'1101A',n:'Vins & Spiritueux'},
  {c:'2931Z',n:'Fab. Équip. Automobile'},
  {c:'2932Z',n:'Fab. Pièces Automobile'},
  {c:'4672Z',n:'Grossiste Métaux'},
  {c:'4673A',n:'Grossiste Bois'},
  {c:'7112B',n:'Ingénierie Technique'},
  {c:'1011Z',n:'Abattage Viande'},
  {c:'1012Z',n:'Transform. Volailles'},
  {c:'1399Z',n:'Fab. Textiles Techniques'},
  {c:'2410Z',n:'Sidérurgie Acier'},
  {c:'2442Z',n:'Métallurgie Aluminium'},
  {c:'2444Z',n:'Métallurgie Cuivre'},
  {c:'4771Z',n:'Commerce Luxe'},
  {c:'2311Z',n:'Fab. Verre / Cristal'},
  {c:'2822Z',n:'Fab. Chariots Élévateurs'},
  {c:'2830Z',n:'Fab. Machines Agricoles'},
  {c:'7732Z',n:'Location Équipements'},
  {c:'2229A',n:'Fab. Composites Carbone'},
];

var ng=document.getElementById('naf-grid');
NAFS.forEach(function(n,i){
  var d=document.createElement('div');
  d.className='nc';d.dataset.i=i;
  d.innerHTML=n.n+'<span class="c">'+n.c+'</span>';
  d.onclick=function(){this.classList.toggle('on');};
  ng.appendChild(d);
});

var pg=1,leads=[],total=0;

function log(t,e){
  var el=document.getElementById('log');
  var d=document.createElement('div');
  if(e)d.className='err';
  d.textContent='› '+t;
  el.appendChild(d);el.scrollTop=el.scrollHeight;
}
function pb(p){document.getElementById('pb').style.width=p+'%';}

function go(p){
  var nafs=[];
  document.querySelectorAll('.nc.on').forEach(function(c){nafs.push(NAFS[+c.dataset.i].c);});
  if(!nafs.length){alert('Sélectionne au moins 1 code NAF !');return;}
  pg=p;
  if(p===1){leads=[];total=0;}
  document.getElementById('btn1').disabled=true;
  document.getElementById('btn2').disabled=true;
  document.getElementById('log').innerHTML='';
  pb(5);

  var key=document.getElementById('key').value.trim();
  var camin=document.getElementById('camin').value||5000000;
  var camax=document.getElementById('camax').value||125000000;
  var eff=document.getElementById('eff').value;
  var pp=document.getElementById('pp').value||50;
  var dept=document.getElementById('dept').value;

  log('Page '+p+' · '+nafs.length+' codes NAF · CA '+Math.round(camin/1e6)+'–'+Math.round(camax/1e6)+' M€');

  var done=0,batch=[];
  nafs.forEach(function(naf){
    var url='https://api.pappers.fr/v2/entreprises'
      +'?api_token='+encodeURIComponent(key)
      +'&code_naf='+naf
      +'&chiffre_affaires_min='+camin
      +'&chiffre_affaires_max='+camax
      +'&page='+p
      +'&par_page='+pp
      +'&precision=approximative';
    if(eff) url+='&effectif_min='+eff;
    if(dept) url+='&departement='+dept;

    fetch(url)
    .then(function(r){return r.json();})
    .then(function(d){
      var res=d.resultats||d.entreprises||[];
      if(d.total) total+=d.total;
      log(naf+' → '+res.length+' résultats'+(d.total?' / '+d.total+' dispo':''));
      res.forEach(function(e){batch.push(build(e,naf));});
      done++;pb(5+Math.round(done/nafs.length*90));
      if(done===nafs.length)finish(batch);
    })
    .catch(function(err){
      log(naf+' → '+err.message,true);
      done++;pb(5+Math.round(done/nafs.length*90));
      if(done===nafs.length)finish(batch);
    });
  });
}

function build(e,naf){
  var nom=e.nom_entreprise||e.denomination||'';
  var siren=(e.siren||'').replace(/\s/g,'');
  var ca=e.chiffre_affaires?Math.round(e.chiffre_affaires/1e6):0;
  var eff=e.effectif||e.tranche_effectif||'';
  var ville=(e.siege&&e.siege.ville)||'';
  var cp=(e.siege&&e.siege.code_postal)||'';
  var dirs=e.dirigeants||[];
  var dn=dirs.length?((dirs[0].prenom||'')+' '+(dirs[0].nom||'')).trim():'';
  var dnp=dirs.length?(dirs[0].qualite||''):'';
  var nafLib=e.libelle_code_naf||e.libelle_naf||'';
  var actualNaf=e.code_naf||naf;
  var enc=encodeURIComponent(nom);
  return{
    nom:nom,siren:siren,naf:actualNaf,nafLib:nafLib,
    ca:ca,eff:eff,ville:ville,cp:cp,dn:dn,dnp:dnp,
    pappers:'https://www.pappers.fr/entreprise/'+siren,
    annuaire:'https://annuaire-entreprises.data.gouv.fr/rechercher?terme='+enc,
    societe:'https://www.societe.com/cgi-bin/search?champs='+enc,
    li:dn?'https://www.linkedin.com/search/results/people/?keywords='+encodeURIComponent(dn+' '+nom):'',
  };
}

function finish(batch){
  var seen={};leads.forEach(function(l){seen[l.siren]=1;});
  batch.forEach(function(l){if(l.siren&&!seen[l.siren]){seen[l.siren]=1;leads.push(l);}});
  leads.sort(function(a,b){return (b.ca||0)-(a.ca||0);});
  pb(100);
  log('✅ '+batch.length+' leads · Total cumulé : '+leads.length);
  document.getElementById('btn1').disabled=false;
  document.getElementById('btn2').disabled=false;
  document.getElementById('pginfo').textContent='Page '+pg+(total?' · '+total.toLocaleString('fr-FR')+' dispo':'');
  updStats();render();
}

function updStats(){
  var cas=leads.filter(function(l){return l.ca>0;});
  var caM=cas.length?Math.round(cas.reduce(function(a,l){return a+l.ca;},0)/cas.length):0;
  var avd=leads.filter(function(l){return l.dn;}).length;
  document.getElementById('stats').innerHTML=
    '<div class="st"><div class="stn" style="color:#00e87a">'+leads.length+'</div><div class="stl">Leads</div></div>'+
    '<div class="st"><div class="stn" style="color:#3dde7a">'+(caM?caM+' M€':'—')+'</div><div class="stl">CA moyen</div></div>'+
    '<div class="st"><div class="stn" style="color:#4488ff">'+avd+'</div><div class="stl">Avec dirigeant</div></div>'+
    '<div class="st"><div class="stn" style="color:#888">'+pg+'</div><div class="stl">Page</div></div>';
}

function render(){
  var t=document.getElementById('tbl');
  t.innerHTML='<thead><tr>'+
    '<th>#</th><th>Société</th><th>Code NAF</th><th>Ville</th>'+
    '<th>CA</th><th>Effectif</th><th>Dirigeant</th><th>Liens</th>'+
    '</tr></thead>';
  var tb=document.createElement('tbody');
  leads.forEach(function(c,i){
    var tr=document.createElement('tr');
    tr.innerHTML=
      '<td style="font-family:monospace;font-size:10px;color:#333">'+String(i+1).padStart(3,'0')+'</td>'+
      '<td style="min-width:175px"><div class="nom">'+c.nom+'</div></td>'+
      '<td><span class="nb">'+c.naf+'</span>'+(c.nafLib?'<div class="sub">'+c.nafLib+'</div>':'')+'</td>'+
      '<td style="font-size:11px;color:#555;white-space:nowrap">'+(c.ville||'—')+(c.cp?'<div style="font-size:10px;color:#333">'+c.cp.slice(0,2)+'</div>':'')+'</td>'+
      '<td class="ca">'+(c.ca?c.ca+' M€':'—')+'</td>'+
      '<td>'+(c.eff?'<span class="ef">'+c.eff+'</span>':'—')+'</td>'+
      '<td>'+(c.dn?'<div class="dn">'+c.dn+'</div><div class="sub">'+c.dnp+'</div>':'—')+'</td>'+
      '<td>'+
        '<a href="'+c.pappers+'" target="_blank" class="lk">🟠 Pappers</a>'+
        '<a href="'+c.annuaire+'" target="_blank" class="lk">🏛 Annuaire</a>'+
        '<a href="'+c.societe+'" target="_blank" class="lk">🏢 Societe</a>'+
        (c.li?'<a href="'+c.li+'" target="_blank" class="lk">💼 LinkedIn</a>':'')+
      '</td>';
    tb.appendChild(tr);
  });
  t.appendChild(tb);
}

function xls(){
  if(!leads.length||!window.XLSX)return;
  var hd=['#','Société','SIREN','Code NAF','Activité NAF','Ville','CP','CA (M€)','Effectif','Dirigeant','Poste','Pappers','Annuaire','Societe','LinkedIn'];
  var d=[hd].concat(leads.map(function(c,i){
    return[i+1,c.nom,c.siren,c.naf,c.nafLib,c.ville,c.cp,c.ca||'',c.eff||'',c.dn||'',c.dnp||'',c.pappers,c.annuaire,c.societe,c.li||''];
  }));
  var wb=XLSX.utils.book_new();
  var ws=XLSX.utils.aoa_to_sheet(d);
  ws['!cols']=[{wch:4},{wch:35},{wch:12},{wch:8},{wch:35},{wch:20},{wch:6},{wch:8},{wch:12},{wch:25},{wch:20},{wch:45},{wch:45},{wch:45},{wch:45}];
  XLSX.utils.book_append_sheet(wb,ws,'Leads Pappers');
  XLSX.writeFile(wb,'LeadFX_'+new Date().toISOString().slice(0,10)+'.xlsx');
}
function csv(){
  if(!leads.length)return;
  var hd=['#','Société','SIREN','Code NAF','Activité','Ville','CP','CA (M€)','Effectif','Dirigeant','Poste','Pappers','Annuaire'];
  var rows=[hd].concat(leads.map(function(c,i){
    return[i+1,c.nom,c.siren,c.naf,c.nafLib,c.ville,c.cp,c.ca||'',c.eff||'',c.dn||'',c.dnp||'',c.pappers,c.annuaire];
  }));
  var a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(rows.map(function(r){return r.map(function(v){return'"'+String(v||'').replace(/"/g,'""')+'"';}).join(',');}).join('\n'));
  a.download='LeadFX_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}
</script>
</body>
</html>
