  '2059Z':{p:'EUR/USD',f6:'Achats précurseurs chimiques USD marchés mondiaux',f7:'Ventes spécialités chimiques export USD/GBP'},

  '2444Z':{p:'EUR/USD',f6:'Achats cuivre USD LME — très sensible variations quotidiennes',f7:'Ventes cuivre transformé export hors UE en devises'},

var EFF_LBL = {'11':'10–19','12':'20–49','21':'50–99','22':'100–199','31':'200–249','32':'250–499','41':'500+','42':'1000+'};

// ── Grille NAF ────────────────────────────────────────
(function(){
  var g = document.getElementById('naf-grid');
  NAFS.forEach(function(n,i){
    var d = document.createElement('div');
    d.className='nc'; d.dataset.i=i;
    d.innerHTML = n.n+'<span class="ncode">'+n.c+'</span>';
    d.onclick = function(){ this.classList.toggle('on'); };
    g.appendChild(d);
  });
})();

// ── État ──────────────────────────────────────────────
var leads=[], running=false, shouldStop=false;
var BL={};
try{ BL=JSON.parse(localStorage.getItem('lfx_bl')||'{}'); }catch(e){}

// ── Démarrer ──────────────────────────────────────────
function start(){
  var nafs=[];
  document.querySelectorAll('.nc.on').forEach(function(c){ nafs.push(NAFS[+c.dataset.i].c); });
  if(!nafs.length){ alert('Sélectionne au moins 1 secteur !'); return; }

  leads=[]; BL={};
  localStorage.removeItem('lfx_bl');
  running=true; shouldStop=false;

  document.getElementById('btn-go').disabled=true;
  document.getElementById('btn-stop').disabled=false;
  document.getElementById('log').innerHTML='';
  document.getElementById('tbl').innerHTML='';
  pbar(0);

  var nb     = parseInt(document.getElementById('nb').value)||50;
  var caMin  = parseInt(document.getElementById('camin').value)||5000000;
  var caMax  = parseInt(document.getElementById('camax').value)||125000000;
  var dept   = document.getElementById('dept').value;

  log('Démarrage · '+nafs.length+' NAF · CA '+Math.round(caMin/1e6)+'–'+Math.round(caMax/1e6)+' M€ · PME uniquement');

  // Pour chaque NAF, paginer jusqu'à trouver assez ou épuiser
  var nafQueue = nafs.slice();
  var curNaf = null, curPage = 1, scanned = 0, totalPages = {};

  function nextRequest(){
    if(shouldStop || leads.length >= nb){ finish(); return; }

    // Choisir le NAF courant
    if(!curNaf || (totalPages[curNaf] && curPage > totalPages[curNaf])){
      if(!nafQueue.length){ finish(); return; }
      curNaf = nafQueue.shift();
      curPage = 1;
    }

    var url = API
      + '?activite_principale=' + encodeURIComponent(curNaf)
      + '&categorie_entreprise=PME'
      + '&per_page=25'
      + '&page=' + curPage;
    if(dept) url += '&departement=' + encodeURIComponent(dept);

    log('NAF '+curNaf+' · page '+curPage+(totalPages[curNaf]?' / '+Math.ceil(totalPages[curNaf]):'')+'…');

    fetch(url, { headers:{'Accept':'application/json'}, signal:AbortSignal.timeout(15000) })
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){
      var res = d.results || [];
      var total = d.total_results || 0;
      if(total && !totalPages[curNaf]) totalPages[curNaf] = Math.ceil(total/25);

      var added=0;
      res.forEach(function(e){
        if(leads.length >= nb) return;
        var siren = (e.siren||'').replace(/\s/g,'');
        if(!siren || BL[siren]) return;

        // ── Filtre CA : OBLIGATOIRE et dans la plage ──
        var ca = e.chiffre_affaires || 0;
        if(!ca || ca < caMin || ca > caMax) return;

        // ── Filtre catégorie : PME confirmée ──────────
        if(e.categorie_entreprise !== 'PME') return;

        // ── Etat actif ────────────────────────────────
        if(e.etat_administratif && e.etat_administratif !== 'A') return;

        BL[siren]=1;
        var dirs = e.dirigeants||[];
        var dn = dirs.length?((dirs[0].prenom||'')+' '+(dirs[0].nom||'')).trim():'';
        var dnp = dirs.length?(dirs[0].qualite||''):'';
        var nom = e.nom_raison_sociale||e.nom_complet||'';
        var nafLib = e.libelle_activite_principale||'';
        var ville = (e.siege&&e.siege.libelle_commune)||'';
        var cp = (e.siege&&e.siege.code_postal)||'';
        var effCode = e.tranche_effectif_salarie||'';
        var caM = Math.round(ca/1e6);
        var enc = encodeURIComponent(nom);

        leads.push({
          nom:nom, siren:siren, naf:curNaf, nafLib:nafLib,
          ca:caM, effCode:effCode, effLbl:EFF_LBL[effCode]||'',
          ville:ville, cp:cp, dn:dn, dnp:dnp,
          fx: FX[curNaf]||null,
          pappers: 'https://www.pappers.fr/entreprise/'+siren,
          annuaire: 'https://annuaire-entreprises.data.gouv.fr/rechercher?terme='+enc,
          societe: 'https://www.societe.com/cgi-bin/search?champs='+enc,
          li: dn?'https://www.linkedin.com/search/results/people/?keywords='+encodeURIComponent(dn+' '+nom):'',
        });
        added++;
      });

      scanned += res.length;
      log('NAF '+curNaf+' p.'+curPage+' → '+res.length+' résultats · '+added+' qualifiés (PME + CA OK) · Total : '+leads.length);
      pbar(Math.min(95, (leads.length/nb)*100));
      document.getElementById('info').textContent = leads.length+' leads trouvés · '+scanned+' entreprises scannées';

      // Avancer
      if(res.length < 25 || (totalPages[curNaf] && curPage >= totalPages[curNaf])){
        // Ce NAF est épuisé → passer au suivant
        curNaf = null; curPage = 1;
      } else {
        curPage++;
      }

      updStats(); render();
      setTimeout(nextRequest, 300);
    })
    .catch(function(err){
      log('NAF '+curNaf+' p.'+curPage+' → ERREUR : '+err.message, true);
      curNaf=null; curPage=1;
      setTimeout(nextRequest, 500);
    });
  }

  nextRequest();
}

function stop(){
  shouldStop=true;
  log('⬛ Arrêt demandé…');
}

function finish(){
  try{ localStorage.setItem('lfx_bl', JSON.stringify(BL)); }catch(e){}
  running=false;
  leads.sort(function(a,b){ return (b.ca||0)-(a.ca||0); });
  pbar(100);
  log('✅ '+leads.length+' leads · CA renseigné · PME INSEE · 5–125 M€');
  document.getElementById('btn-go').disabled=false;
  document.getElementById('btn-stop').disabled=true;
  updStats(); render();
}

function updStats(){
  var cas = leads.filter(function(l){return l.ca>0;});
  var caM = cas.length ? Math.round(cas.reduce(function(a,l){return a+l.ca;},0)/cas.length):0;
  var avd = leads.filter(function(l){return l.dn;}).length;
  var avfx = leads.filter(function(l){return l.fx;}).length;
  document.getElementById('stats').innerHTML =
    '<div class="st"><div class="stn" style="color:#00e87a">'+leads.length+'</div><div class="stl">Leads PME</div></div>'+
    '<div class="st"><div class="stn" style="color:#3dde7a">'+(caM?caM+' M€':'—')+'</div><div class="stl">CA moyen</div></div>'+
    '<div class="st"><div class="stn" style="color:#4488ff">'+avd+'</div><div class="stl">Avec dirigeant</div></div>'+
    '<div class="st"><div class="stn" style="color:#00e87a">'+avfx+'</div><div class="stl">Avec 666/766</div></div>';
}

function render(){
  var t = document.getElementById('tbl');
  t.innerHTML = '<thead><tr>'+
    '<th>#</th><th>Société</th><th>NAF</th><th>Ville</th>'+
    '<th>CA réel</th><th>Effectif</th><th>Dirigeant</th>'+
    '<th>Paire FX</th><th>Flux 666</th><th>Flux 766</th>'+
    '<th>Liens</th>'+
    '</tr></thead>';
  var tb = document.createElement('tbody');
  leads.forEach(function(c,i){
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td style="font-family:monospace;font-size:10px;color:#333">'+String(i+1).padStart(3,'0')+'</td>'+
      '<td style="min-width:170px">'+
        '<div class="nom">'+c.nom+'</div>'+
        '<span class="pme-tag">PME</span>'+
      '</td>'+
      '<td><span class="nb">'+c.naf+'</span>'+(c.nafLib?'<div class="sub2">'+c.nafLib+'</div>':'')+'</td>'+
      '<td style="font-size:11px;color:#555;white-space:nowrap">'+(c.ville||'—')+(c.cp?'<div style="font-size:10px;color:#333">'+c.cp.slice(0,2)+'</div>':'')+'</td>'+
      '<td class="ca">'+c.ca+' M€</td>'+
      '<td>'+(c.effLbl?'<span class="ef">'+c.effLbl+'</span>':'—')+'</td>'+
      '<td>'+(c.dn?'<div class="dn">'+c.dn+'</div><div class="sub2">'+c.dnp+'</div>':'—')+'</td>'+
      (c.fx?
        '<td style="font-family:monospace;font-size:10px;color:#4488ff">'+c.fx.p+'</td>'+
        '<td style="font-size:11px;color:#555;max-width:180px;line-height:1.4"><span class="f6-l">666</span> '+c.fx.f6+'</td>'+
        '<td style="font-size:11px;color:#555;max-width:180px;line-height:1.4"><span class="f7-l">766</span> '+c.fx.f7+'</td>':
        '<td>—</td><td>—</td><td>—</td>')+
      '<td>'+
        '<a href="'+c.pappers+'" target="_blank" class="lk">🟠 Pappers</a>'+
        '<a href="'+c.annuaire+'" target="_blank" class="lk">🏛 Annuaire</a>'+
        '<a href="'+c.societe+'" target="_blank" class="lk">🏢 Societe</a>'+
        (c.li?'<a href="'+c.li+'" target="_blank" class="lk">💼 LinkedIn</a>':'')+
      '</td>';
    tb.appendChild(tr);
  });
  t.appendChild(tb);
}

function xls(){
  if(!leads.length||!window.XLSX)return;
  var hd=['#','Société','SIREN','Code NAF','Activité','Ville','CA (M€)','Effectif','Dirigeant','Poste','Paire FX','Flux 666','Flux 766','Pappers','Annuaire','Societe','LinkedIn'];
  var d=[hd].concat(leads.map(function(c,i){
    return[i+1,c.nom,c.siren,c.naf,c.nafLib,c.ville,c.ca,c.effLbl||'',c.dn||'',c.dnp||'',
      c.fx?c.fx.p:'',c.fx?c.fx.f6:'',c.fx?c.fx.f7:'',c.pappers,c.annuaire,c.societe,c.li||''];
  }));
  var wb=XLSX.utils.book_new();
  var ws=XLSX.utils.aoa_to_sheet(d);
  ws['!cols']=[{wch:4},{wch:35},{wch:12},{wch:8},{wch:35},{wch:20},{wch:8},{wch:12},{wch:25},{wch:20},{wch:12},{wch:55},{wch:55},{wch:40},{wch:40},{wch:40},{wch:40}];
  XLSX.utils.book_append_sheet(wb,ws,'Leads FX PME');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([
    ['LeadFX Pro','API SIREN Officielle Gratuite'],
    ['Filtre','PME INSEE + CA renseigné 5–125 M€'],
    ['Date',new Date().toLocaleDateString('fr-FR')],
    ['Total leads',leads.length],
    ['CA moyen',leads.length?Math.round(leads.reduce(function(a,l){return a+l.ca;},0)/leads.length)+' M€':'—'],
    ['Avec dirigeant',leads.filter(function(l){return l.dn;}).length],
    ['Avec 666/766',leads.filter(function(l){return l.fx;}).length],
  ]),'Résumé');
  XLSX.writeFile(wb,'LeadFX_PME_'+new Date().toISOString().slice(0,10)+'.xlsx');
}
function xcsv(){
  if(!leads.length)return;
  var hd=['#','Société','SIREN','NAF','Activité','Ville','CA (M€)','Effectif','Dirigeant','Paire FX','Flux 666','Flux 766','Pappers','Annuaire'];
  var rows=[hd].concat(leads.map(function(c,i){
    return[i+1,c.nom,c.siren,c.naf,c.nafLib,c.ville,c.ca,c.effLbl||'',c.dn||'',
      c.fx?c.fx.p:'',c.fx?c.fx.f6:'',c.fx?c.fx.f7:'',c.pappers,c.annuaire];
  }));
  var a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(rows.map(function(r){
    return r.map(function(v){return'"'+String(v||'').replace(/"/g,'""')+'"';}).join(',');
  }).join('\n'));
  a.download='LeadFX_PME_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

function log(t,e){
  var el=document.getElementById('log');
  var d=document.createElement('div');
  if(e)d.className='e';
  d.textContent='› '+t;
  el.appendChild(d);el.scrollTop=el.scrollHeight;
}
function pbar(p){document.getElementById('pb').style.width=p+'%';}
</script>
